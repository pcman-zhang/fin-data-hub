# Alembic 配置（TASK-3.3.1）：版本化迁移（doc-13 §7）。
# DSN 不在此配置：由环境变量 DATABASE_*（FDP_DATABASE_HOST 可覆盖主机）提供，
# 或经 fin_data_platform.storage.migrations.upgrade()/downgrade() 程序化传入。
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
