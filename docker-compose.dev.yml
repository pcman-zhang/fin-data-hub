# 本地开发/集成测试数据库（仅数据库；应用编排见 docker-compose.yml）。
#
# 项目名与全栈隔离（dev 卷 / 容器不互相接管）；端口默认退避到 15432，
# 避免与全栈（默认 5432）冲突，两者可同时运行。
#
#   cp .env.example .env  # 填写 POSTGRES_PASSWORD / DATABASE_*
#   docker compose -f docker-compose.dev.yml up -d
name: fin-data-platform-dev

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD（参考 .env.example）}
      POSTGRES_DB: ${POSTGRES_DB:-fin_data_platform}
    ports:
      # 默认对所有接口开放；仅本机访问可设 DEV_POSTGRES_BIND=127.0.0.1
      - "${DEV_POSTGRES_BIND:-0.0.0.0}:${DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-fdp} -d ${POSTGRES_DB:-fin_data_platform}
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  timescaledb-data:
