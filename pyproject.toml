[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-data-hub"
description = "多源金融数据聚合库：统一接口获取 Tushare / Wind / 同花顺 iFinD / AkShare 数据"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "pandas>=3.0,<4",
]

[project.optional-dependencies]
tushare = ["tushare>=1.4"]
akshare = ["akshare>=1.17"]
ifind = ["httpx>=0.27"]
wind = ["httpx>=0.27"]
fuyao = ["httpx>=0.27"]
baostock = ["baostock>=0.8"]
platform = ["pydantic>=2.7", "pyyaml>=6.0", "sqlalchemy>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[tool.setuptools.dynamic]
version = { attr = "fin_data_hub._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fin_data_hub = ["py.typed", "specs/*.toml"]
fin_data_platform = [
    "py.typed",
    "dictionary/_schema/*.json",
    "dictionary/*/*.yaml",
    "dictionary/*/*/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: 需要真实凭证与外网的集成测试（默认跳过；用 pytest -m integration 运行）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
packages = ["fin_data_hub", "fin_data_platform"]

[[tool.mypy.overrides]]
module = ["tushare.*", "akshare.*", "baostock.*", "yaml.*"]
ignore_missing_imports = true
