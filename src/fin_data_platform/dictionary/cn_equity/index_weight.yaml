dataset: cn_equity.index_weight
semantic_version: 1
domain: cn_equity
description: 指数成分与权重（月度快照；快照型 PIT，as-of 取最近一期）
pit_class: snapshot
business_key: [index_security_id, trade_date, con_security_id]
physical_key: [index_security_id, trade_date, con_security_id, knowledge_time, version]
grain: 指数 × 快照日 × 成分
update_sla:
  frequency: monthly
  earliest_available: "T+1 12:00"
  latest_available: "T+2 22:00"
  tolerance: "2d"
sources:
  - provider: tushare
    endpoint: index_weight
coverage:
  universe: 沪深主要指数
  universe_source: ref.security_master
  history_start: "2005-04-08"
  expected_dates:
    calendar: ref.index_weight_schedule
    frequency: monthly
storage:
  canonical_table: cn_equity.index_weight
  read_model: mart.index_weight_v1
  read_model_impl: view
  partition_strategy: event_time
  partition_interval: 1 year
  retention: all
  compression:
    after: 30 days
    segment_by: index_security_id
    order_by: trade_date
quality:
  - rule: unique
    keys: [index_security_id, trade_date, con_security_id]
    severity: error
  - rule: range
    field: weight
    min: 0
    max: 100
    severity: error
lineage:
  upstream: []
  transform: raw
mappings:
  - provider: tushare
    endpoint: index_weight
    fields:
      index_security_id: index_code
      con_security_id: con_code
      weight: weight
fields:
  - name: index_security_id
    type: int64
    nullable: false
    description: 指数标的 ID
    pit_role: none
  - name: trade_date
    type: date
    nullable: false
    description: 快照日（月度）
    pit_role: event_time
  - name: con_security_id
    type: int64
    nullable: false
    description: 成分标的 ID
    pit_role: none
  - name: weight
    type: decimal
    precision: 12
    scale: 6
    unit: 百分数
    nullable: false
    description: 成分权重（百分数）
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间
    pit_role: knowledge_time
  - name: ingest_time
    type: timestamp_tz
    nullable: false
    description: 物理入库时间
    pit_role: ingest_time
  - name: version
    type: int64
    nullable: false
    description: 同业务键版本号
    pit_role: none
  - name: provider
    type: enum
    enum: [tushare]
    nullable: false
    description: 数据来源
    pit_role: none
