dataset: cn_equity.market_events.namechange
semantic_version: 1
domain: cn_equity
description: 名称变更历史（生效闭区间 + 公告日；用于 as-of 属性还原）
pit_class: scd2
business_key: [security_id, start_date]
physical_key: [security_id, start_date, knowledge_time, version]
grain: 标的 × 名称生效区间
update_sla:
  frequency: daily
  earliest_available: "T+0 20:00"
  latest_available: "T+1 22:00"
  tolerance: "1d"
sources:
  - provider: tushare
    endpoint: namechange
coverage:
  universe: A 股（含退市）
  universe_source: ref.security_master
  history_start: "1990-12-19"
  expected_dates:
    calendar: ref.trade_calendar
    frequency: daily
storage:
  canonical_table: cn_equity.market_events_namechange
  read_model: mart.namechange_v1
  read_model_impl: view
  partition_strategy: none
  partition_interval: none
  retention: all
quality:
  - rule: unique
    keys: [security_id, start_date, knowledge_time, version]
    severity: error
  - rule: expression
    expr: "end_date >= start_date"
    severity: error
lineage:
  upstream: []
  transform: raw
mappings:
  - provider: tushare
    endpoint: namechange
    fields:
      name: name
      start_date: start_date
      end_date: end_date
      ann_date: ann_date
      change_reason: change_reason
fields:
  - name: security_id
    type: int64
    nullable: false
    description: 标的 ID
    pit_role: none
  - name: name
    type: string
    nullable: false
    description: 证券简称（该区间内）
    pit_role: none
  - name: start_date
    type: date
    nullable: false
    description: 名称生效起始日（含当日）
    pit_role: event_time
  - name: end_date
    type: date
    nullable: true
    description: 名称生效结束日（含当日；NULL=至今）
    pit_role: none
  - name: ann_date
    type: date
    nullable: true
    description: 公告日（知识时间来源）
    pit_role: publish_time
  - name: change_reason
    type: string
    nullable: true
    description: 变更原因
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间
    pit_role: knowledge_time
  - name: version
    type: int64
    nullable: false
    description: 同业务键版本号
    pit_role: none
  - name: provider
    type: enum
    enum: [tushare]
    nullable: false
    description: 数据来源
    pit_role: none
