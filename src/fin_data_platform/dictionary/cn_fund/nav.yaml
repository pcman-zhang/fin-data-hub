dataset: cn_fund.nav
semantic_version: 1
domain: cn_fund
description: 场外基金净值（单位净值/累计净值；日频）
pit_class: market
business_key: [entity_id, date]
physical_key: [entity_id, date, knowledge_time, version]
grain: 基金 × 净值日期
update_sla:
  frequency: daily
  earliest_available: "T+1 09:00"
  latest_available: "T+1 23:59"
  tolerance: "1d"
sources:
  - provider: tushare
    endpoint: fund_nav
  - provider: akshare
    endpoint: fund_open_fund_info_em
coverage:
  universe: 场外公募基金（含清盘）
  universe_source: ref.entity
  history_start: "2001-01-01"
  expected_dates:
    calendar: ref.trade_calendar
    frequency: daily
storage:
  canonical_table: cn_fund.nav
  read_model: mart.fund_nav_v1
  read_model_impl: view
  partition_strategy: event_time
  partition_interval: 1 year
  retention: all
  compression:
    after: 7 days
    segment_by: entity_id
    order_by: date
quality:
  - rule: unique
    keys: [entity_id, date, knowledge_time, version]
    severity: error
  - rule: range
    field: unit_nav
    min: 0
    severity: error
  - rule: reconcile
    against: ref.entity
    severity: warn
lineage:
  upstream: []
  transform: raw
mappings:
  - provider: tushare
    endpoint: fund_nav
    fields:
      unit_nav: unit_nav
      accum_nav: accum_nav
  - provider: akshare
    endpoint: fund_open_fund_info_em
    fields:
      unit_nav: 单位净值
      accum_nav: 累计净值
fields:
  - name: entity_id
    type: int64
    nullable: false
    description: 基金标的 ID
    pit_role: none
  - name: date
    type: date
    nullable: false
    description: 净值日期
    pit_role: event_time
  - name: unit_nav
    type: decimal
    precision: 16
    scale: 6
    unit: 元
    nullable: false
    description: 单位净值
    pit_role: none
  - name: accum_nav
    type: decimal
    precision: 16
    scale: 6
    unit: 元
    nullable: true
    description: 累计净值
    pit_role: none
  - name: daily_return
    type: float64
    unit: 百分数
    nullable: true
    description: 日增长率（百分数）
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间
    pit_role: knowledge_time
  - name: ingest_time
    type: timestamp_tz
    nullable: false
    description: 物理入库时间
    pit_role: ingest_time
  - name: version
    type: int64
    nullable: false
    description: 同业务键版本号
    pit_role: none
  - name: provider
    type: enum
    enum: [tushare, akshare]
    nullable: false
    description: 数据来源
    pit_role: none
