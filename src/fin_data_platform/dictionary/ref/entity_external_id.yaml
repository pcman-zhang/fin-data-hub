dataset: ref.entity_external_id
semantic_version: 1
domain: ref
description: 实体外部标识（isin/figi/cusip/sedol/lei/uscc；不含 ticker）
pit_class: scd2
business_key: [entity_id, id_type, id_value, valid_from]
physical_key: [entity_id, id_type, id_value, valid_from, knowledge_time, version]
grain: 实体 × 标识类型 × 标识值 × 生效区间
update_sla:
  frequency: daily
  earliest_available: "T+1 08:00"
  latest_available: "T+1 22:00"
  tolerance: "1d"
sources: []
coverage:
  universe: 有外部标识登记的实体
  universe_source: ref.entity
  history_start: "1990-12-19"
  expected_dates:
    calendar: ref.trade_calendar
    frequency: daily
storage:
  canonical_table: ref.entity_external_id
  read_model: mart.entity_external_id_v1
  read_model_impl: view
  partition_strategy: none
  partition_interval: none
  retention: all
quality:
  - rule: unique
    keys: [entity_id, id_type, id_value, valid_from, knowledge_time, version]
    severity: error
  - rule: not_null
    fields: [entity_id, id_type, id_value, valid_from, knowledge_time, version]
    severity: error
  - rule: reconcile
    against: ref.entity
    severity: warn
lineage:
  upstream:
    - dataset: ref.entity
  transform: derive
mappings: []
fields:
  - name: entity_id
    type: int64
    nullable: false
    description: 实体 ID
    pit_role: none
  - name: id_type
    type: enum
    enum: [isin, figi, cusip, sedol, lei, uscc, other]
    nullable: false
    description: 外部标识类型（不含 ticker）
    pit_role: none
  - name: id_value
    type: string
    nullable: false
    description: 外部标识值
    pit_role: none
  - name: valid_from
    type: date
    nullable: false
    description: 标识区间起点（SCD2 闭区间）
    pit_role: event_time
  - name: valid_to
    type: date
    nullable: true
    description: 标识区间终点（NULL=至今）
    pit_role: none
  - name: knowledge_time
    type: timestamp_tz
    nullable: false
    description: 该版本进入平台的时间
    pit_role: knowledge_time
  - name: version
    type: int64
    nullable: false
    description: 同标识版本号（append-only）
    pit_role: none
